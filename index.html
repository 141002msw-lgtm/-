<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>픽션 볼 파이트</title>
<style>
:root{--bg:#eef2fb;--bg2:#d5def5;--fg:#141a2e;--mut:#55607f;--card:#ffffffd9;--line:#c3cde6;--ac:#e08a00;--hpbg:#d5dbea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1220;--bg2:#1c2548;--fg:#f4f6fb;--mut:#a9b2cc;--card:#ffffff12;--line:#ffffff26;--ac:#ffcf4a;--hpbg:#ffffff20}}
:root[data-theme="dark"]{--bg:#0e1220;--bg2:#1c2548;--fg:#f4f6fb;--mut:#a9b2cc;--card:#ffffff12;--line:#ffffff26;--ac:#ffcf4a;--hpbg:#ffffff20}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}
.scr{display:none;height:100%;overflow-y:auto;flex-direction:column;align-items:center;padding:20px 14px;background:linear-gradient(160deg,var(--bg),var(--bg2))}
.scr.on{display:flex}
.eyebrow{letter-spacing:.3em;font-size:12px;color:var(--mut);margin-top:6px}
h1{margin:6px 0 2px;font-size:clamp(30px,7vw,52px);font-weight:900;text-align:center;background:linear-gradient(90deg,#ff8a1f,var(--ac),#e23b3b);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:0 0 18px;font-size:14px}
#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;width:min(100%,780px)}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;text-align:center;cursor:pointer;transition:.15s}
.card.on{border-color:var(--ac);transform:translateY(-3px);box-shadow:0 8px 24px #0003}
.card h3{margin:4px 0 0;font-size:20px}.card .hp{margin:2px 0 8px;color:var(--mut);font-size:13px}
.card ul{list-style:none;margin:0;padding:0;text-align:left;font-size:13px;line-height:1.7}
.card li b{color:var(--ac)}
.team{border-radius:20px;padding:12px;border:2px solid var(--tc);background:var(--card)}.team h2{margin:0 0 10px;font-size:16px;color:var(--tc);text-align:center}.team .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.team .card{padding:8px;max-width:200px;width:100%;margin:0 auto}.team .card ul{font-size:10px;line-height:1.5}.team .card h3{font-size:17px}
.note{color:var(--mut);font-size:12px;margin:14px 0 4px;text-align:center}
button.pri{font:inherit;font-weight:800;font-size:17px;padding:13px 40px;border:0;border-radius:999px;background:var(--ac);color:#1b1200;cursor:pointer;margin-top:8px}
button.sec{font:inherit;font-weight:700;padding:13px 26px;border:2px solid var(--line);border-radius:999px;background:transparent;color:var(--fg);cursor:pointer}
#hud{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;width:min(100%,820px);margin-bottom:8px}
.vs{font-weight:900;color:var(--mut);padding-top:6px}
.nm{font-weight:800;font-size:14px;margin-bottom:4px}.r{text-align:right}
.bar{position:relative;height:18px;border-radius:9px;background:var(--hpbg);overflow:hidden;display:flex}
.r .bar{justify-content:flex-end}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3ccf6e,#9be15d);transition:width .15s}
.bar span{position:absolute;inset:0;text-align:center;font-size:12px;font-weight:800;line-height:18px;color:#0b1a0f}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.r .chips{justify-content:flex-end}
.chip{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:10px;padding:4px 8px;font-size:11px;background:var(--card);min-width:70px;text-align:center}
.chip u{position:absolute;left:0;right:0;bottom:0;background:#0007}
.chip b,.chip span{position:relative;display:block}.chip span{color:var(--mut);font-size:10px}
canvas#c{display:block;width:auto;height:auto;max-width:100%;max-height:calc(100dvh - 300px);border-radius:14px;border:2px solid var(--line);touch-action:none;background:#141a30}
.hint{color:var(--mut);font-size:12px;margin-top:8px;text-align:center}
#res{display:none;position:fixed;inset:0;background:#000a;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#res.on{display:flex}#res h2{font-size:46px;margin:0}#res div{display:flex;gap:10px}
#res button.sec{color:#fff;border-color:#fff6}
#ctl{display:flex;gap:8px;margin-top:8px;justify-content:center}.pill{font:inherit;font-size:13px;font-weight:700;padding:7px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--fg);cursor:pointer}.pill.on{background:#e0392f;border-color:#e0392f;color:#fff}.pill.fast{background:var(--ac);border-color:var(--ac);color:#1b1200}
#vid{display:none;position:fixed;inset:0;background:#000d;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px;z-index:30;text-align:center}#vid.on{display:flex}#vid h2{margin:0}#vid video{max-width:min(92vw,560px);max-height:55vh;border-radius:12px;background:#000}#vid p{margin:0;font-size:13px;color:#cfd6e8;min-height:18px}#vid div{display:flex;gap:10px}#vid button.sec{color:#fff;border-color:#fff6}
#intro{display:none;position:fixed;inset:0;background:#000c;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;overflow:auto;text-align:center}#intro.on{display:flex}#intro h2{margin:0;font-size:26px}#intro button.sec{color:#fff;border-color:#fff6;padding:8px 22px}
#ic{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;width:min(100%,660px)}.ib{border:2px solid var(--tc);border-radius:16px;padding:10px;background:#ffffff14;text-align:left;font-size:12px}.ib h3{margin:0 0 2px;font-size:18px}.ib p{margin:2px 0;color:#cfd6e8}.ib ul{margin:4px 0 6px;padding-left:16px;line-height:1.55}.ib li b{color:#ffd24a}.ib .rvl{color:#ff9aa5;font-weight:700;margin-top:6px}
.tabs{display:flex;gap:6px;margin-bottom:10px;justify-content:center;flex-wrap:wrap}.tab{font:inherit;font-size:12px;font-weight:700;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--mut);cursor:pointer}.tab.on{background:var(--tc);border-color:var(--tc);color:#fff}
</style>
</head>
<body>
<div id="lobby" class="scr on">

</div>
<div id="game" class="scr">

</div>
<div id="intro"><h2>전투 준비</h2><div id="ic"></div><p id="icd"></p><button class="sec" id="skip">바로 시작</button></div>

<div id="res"><h2 id="rt"></h2><div><button class="pri" id="again">다시 하기</button><button class="sec" id="back">로비로</button></div></div>
